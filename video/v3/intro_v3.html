<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detengue — intro v3</title>
<style>html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   Detengue — intro v3 (pitch). Plano continuo, 100 BPM (beat 0,6 s, compás 2,4 s).
   Determinista: draw(t). Estructura alineada a la rúbrica:
   01 Problema · 02 Solución · 03 Valor de la IA · 04 Viabilidad e impacto · Cierre → demo
   ===================================================================== */
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const W=1920,H=1080, DURATION=73.0, BEAT=0.6, BAR=2.4;
const C={teal:'#0F766E',tealL:'#5EEAD4',tealC:'#CCFBF1',tealD:'#0B4F4A',bgL:'#F7FAF9',inkL:'#10201E',mutL:'#3F4F4C',varL:'#E2ECEA',
  bgD:'#0E1514',inkD:'#E2ECEA',mutD:'#BFCDCA',varD:'#26332F',safe:'#2E7D32',review:'#F59E0B',risk:'#C62828',riskS:'#EF7B7B'};

// ---------- utilidades ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-clamp(p),3);
const ei=p=>Math.pow(clamp(p),3);
const eio=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const eob=p=>{p=clamp(p);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eexp=p=>{p=clamp(p);return p===1?1:1-Math.pow(2,-10*p)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20261003);
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,p)=>{const A=hex2rgb(a),B=hex2rgb(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],clamp(p)))).join(',')})`};
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function catmull(P,u){
  const n=P.length-1,x=clamp(u)*n,i=Math.min(Math.floor(x),n-1),f=x-i;
  const p0=P[Math.max(i-1,0)],p1=P[i],p2=P[i+1],p3=P[Math.min(i+2,n)];
  const c=(a,b,c2,d)=>0.5*((2*b)+(-a+c2)*f+(2*a-5*b+4*c2-d)*f*f+(-a+3*b-3*c2+d)*f*f*f);
  return [c(p0[0],p1[0],p2[0],p3[0]),c(p0[1],p1[1],p2[1],p3[1])];
}

// ---------- texto cinético ----------
function layoutWords(segs,size,weight,maxW){
  ctx.font=`${weight} ${size}px Inter`;
  const words=[]; segs.forEach(([txt,col])=>txt.split(' ').filter(Boolean).forEach(w=>words.push({w,c:col})));
  const space=ctx.measureText(' ').width; const lines=[]; let cur={words:[],width:0};
  words.forEach(o=>{o.width=ctx.measureText(o.w).width; const add=(cur.words.length?space:0)+o.width;
    if(maxW&&cur.width+add>maxW&&cur.words.length){lines.push(cur);cur={words:[o],width:o.width};} else {cur.words.push(o);cur.width+=add;}});
  lines.push(cur); return {lines,space};
}
function kText(segs,x,y,t,t0,o={}){
  if(t<t0-0.01) return;
  const size=o.size||64,weight=o.weight||800,lh=o.lh||size*1.2,align=o.align||'center',st=o.stagger??0.06,dur=o.dur??0.6,out=o.out,am=o.alpha??1,rise=o.rise??34;
  if(out!=null&&t>out+3) return;
  const {lines,space}=layoutWords(segs,size,weight,o.maxW);
  ctx.save(); ctx.font=`${weight} ${size}px Inter`; ctx.textBaseline='alphabetic';
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.glowBlur||30;}
  let k=0;
  lines.forEach((ln,li)=>{
    let cx=align==='center'?x-ln.width/2:(align==='right'?x-ln.width:x); const ly=y+li*lh;
    ln.words.forEach(w=>{
      const s0=t0+k*st,p=eo(seg(t,s0,s0+dur)); let q=0; if(out!=null) q=eio(seg(t,out+k*0.025,out+k*0.025+0.45));
      const a=p*(1-q)*am;
      if(a>0.004){ctx.globalAlpha=a; const bl=(1-p)*14+q*14; ctx.filter=bl>0.4?`blur(${bl.toFixed(1)}px)`:'none';
        ctx.fillStyle=w.c||o.color||'#fff'; ctx.fillText(w.w,cx,ly+(1-p)*rise-q*24);}
      cx+=w.width+space; k++;
    });
  });
  ctx.restore();
}

// ---------- formas ----------
function bucketPath(close){ctx.beginPath();ctx.moveTo(-180,0);ctx.lineTo(-135,320);ctx.quadraticCurveTo(-132,345,-105,345);ctx.lineTo(105,345);ctx.quadraticCurveTo(132,345,135,320);ctx.lineTo(180,0);if(close)ctx.closePath();}
function drawBucket(x,y,s,level,st,rot=0,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y); ctx.scale(s,s);
  if(rot){ctx.translate(0,172);ctx.rotate(rot);ctx.translate(0,-172);}
  ctx.lineJoin='round'; ctx.lineCap='round';
  if(st.glow){ctx.shadowColor=st.glow;ctx.shadowBlur=st.glowBlur||24;}
  ctx.strokeStyle=st.stroke; ctx.lineWidth=(st.lw||6)*1.5;
  ctx.beginPath(); ctx.moveTo(-170,14); ctx.quadraticCurveTo(0,-190,170,14); ctx.stroke();
  ctx.lineWidth=st.lw||6; ctx.shadowBlur=0;
  bucketPath(true); ctx.fillStyle=st.body; ctx.fill();
  if(level>0.005){
    const sy=345-level*300;
    ctx.save(); bucketPath(true); ctx.clip();
    const g=ctx.createLinearGradient(0,sy,0,345); g.addColorStop(0,st.water); g.addColorStop(1,st.water2||st.water);
    ctx.fillStyle=g; ctx.fillRect(-220,sy,440,420); ctx.restore();
    const hw=180-45*(sy/320)-6; ctx.save(); ctx.globalAlpha*=0.6; ctx.beginPath(); ctx.ellipse(0,sy,hw,hw*0.16,0,0,7); ctx.fillStyle=st.surf; ctx.fill(); ctx.restore();
  }
  if(st.glow){ctx.shadowColor=st.glow;ctx.shadowBlur=st.glowBlur||24;}
  bucketPath(false); ctx.stroke(); ctx.beginPath(); ctx.ellipse(0,0,180,28,0,0,7); ctx.stroke();
  ctx.restore();
}
function dropPath(cx,cy,s){const X=v=>cx+(v-54)*s,Y=v=>cy+(v-51)*s;ctx.beginPath();ctx.moveTo(X(54),Y(28));
  ctx.bezierCurveTo(X(54),Y(28),X(38),Y(46),X(38),Y(58));ctx.bezierCurveTo(X(38),Y(66.8),X(45.2),Y(74),X(54),Y(74));
  ctx.bezierCurveTo(X(62.8),Y(74),X(70),Y(66.8),X(70),Y(58));ctx.bezierCurveTo(X(70),Y(46),X(54),Y(28),X(54),Y(28));ctx.closePath();}
function drawCheck(cx,cy,s,col,p){
  const pts=[[-7,4],[-1.5,9.5],[7,-1]].map(([a,b])=>[cx+a*s,cy+b*s]);
  const l=Math.hypot(pts[1][0]-pts[0][0],pts[1][1]-pts[0][1])+Math.hypot(pts[2][0]-pts[1][0],pts[2][1]-pts[1][1]);
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=4*s; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash([l,l]); ctx.lineDashOffset=l*(1-clamp(p));
  ctx.beginPath(); ctx.moveTo(...pts[0]); ctx.lineTo(...pts[1]); ctx.lineTo(...pts[2]); ctx.stroke(); ctx.restore();
}
function drawLogo(cx,cy,r,bg,fg,ck,checkP=1,alpha=1){const s=r/50; ctx.save(); ctx.globalAlpha*=alpha;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,7); ctx.fillStyle=bg; ctx.fill(); dropPath(cx,cy-3*s,s); ctx.fillStyle=fg; ctx.fill();
  if(checkP>0) drawCheck(cx,cy,s,ck,checkP); ctx.restore();}
function drawMosquito(x,y,s,t,dir=1,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y); ctx.scale(s*dir,s); ctx.lineCap='round';
  for(let i=0;i<3;i++){const sw=Math.sin(t*9+i)*3; const a=[-4+i*7,6],b=[-26+i*20+sw,26],c=[-46+i*36+sw,52];
    ctx.strokeStyle='#C7D3D0'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.stroke();
    ctx.strokeStyle='#0E1514'; ctx.lineWidth=2.6; ctx.setLineDash([3,6]); ctx.beginPath(); ctx.moveTo(...b); ctx.lineTo(...c); ctx.stroke(); ctx.setLineDash([]);}
  ctx.shadowColor='rgba(94,234,212,.9)'; ctx.shadowBlur=18;
  ctx.save(); ctx.translate(-26,2); ctx.rotate(-0.18); ctx.beginPath(); ctx.ellipse(0,0,30,8.5,0,0,7); ctx.fillStyle='#DCE6E3'; ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='#0E1514'; ctx.lineWidth=3; for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*10,-8);ctx.lineTo(k*10+2,8);ctx.stroke();} ctx.restore();
  ctx.shadowColor='rgba(94,234,212,.9)'; ctx.shadowBlur=18;
  ctx.beginPath(); ctx.ellipse(6,-2,13,11,0,0,7); ctx.fillStyle='#2A3936'; ctx.fill(); ctx.shadowBlur=0;
  ctx.strokeStyle='#F2F7F6'; ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(1,-9); ctx.quadraticCurveTo(-2,-2,2,5); ctx.moveTo(11,-9); ctx.quadraticCurveTo(14,-2,10,5); ctx.stroke();
  ctx.beginPath(); ctx.arc(22,1,7,0,7); ctx.fillStyle='#2A3936'; ctx.fill();
  ctx.strokeStyle='#C7D3D0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(27,4); ctx.lineTo(50,13); ctx.stroke();
  const flap=Math.abs(Math.sin(t*80)); ctx.fillStyle='rgba(204,251,241,.28)'; ctx.strokeStyle='rgba(204,251,241,.75)'; ctx.lineWidth=1.4;
  for(const side of [-1,1]){ctx.save(); ctx.translate(2,-8); ctx.rotate(-0.45+side*0.12-flap*0.35); ctx.beginPath(); ctx.ellipse(-24,0,28,4+flap*7,0,0,7); ctx.fill(); ctx.stroke(); ctx.restore();}
  ctx.restore();
}
function drawLarva(x,yTop,len,t,ph,alpha){
  ctx.save(); ctx.globalAlpha*=alpha; const n=14,pts=[];
  for(let j=0;j<=n;j++){const f=j/n; pts.push([x+Math.sin(t*6.5+ph-j*0.55)*f*16+Math.sin(ph)*f*10,yTop+f*len]);}
  ctx.shadowColor='rgba(94,234,212,.8)'; ctx.shadowBlur=14; ctx.strokeStyle='rgba(204,251,241,.92)'; ctx.lineCap='round';
  for(let j=0;j<n;j++){ctx.lineWidth=lerp(3,8,j/n); ctx.beginPath(); ctx.moveTo(...pts[j]); ctx.lineTo(...pts[j+1]); ctx.stroke();}
  const hd=pts[n]; ctx.beginPath(); ctx.arc(hd[0],hd[1]+4,8,0,7); ctx.fillStyle='rgba(204,251,241,.95)'; ctx.fill();
  ctx.shadowBlur=0; ctx.lineWidth=1.2; ctx.strokeStyle='rgba(204,251,241,.6)';
  for(let j=3;j<n;j+=2){const p=pts[j];ctx.beginPath();ctx.moveTo(p[0]-9,p[1]-3);ctx.lineTo(p[0]+9,p[1]+3);ctx.stroke();}
  ctx.restore();
}
function icon(kind,cx,cy,r,col='#fff'){
  const s=r/76; ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';
  const P=d=>ctx.stroke(new Path2D(d));
  if(kind==='ok'){ctx.beginPath();ctx.arc(0,0,38,0,7);ctx.stroke();P('M-18 2 L-4 16 L20 -14');}
  if(kind==='chip'){ctx.beginPath();ctx.roundRect(-30,-30,60,60,10);ctx.stroke();P('M-14 -46 v16 M14 -46 v16 M-14 30 v16 M14 30 v16 M-46 -14 h16 M-46 14 h16 M30 -14 h16 M30 14 h16');}
  if(kind==='wifi'){P('M-44 -10 Q0 -50 44 -10 M-26 10 Q0 -12 26 10');ctx.beginPath();ctx.arc(0,30,5,0,7);ctx.fill();P('M-48 -44 L48 48');}
  if(kind==='lock'){ctx.beginPath();ctx.roundRect(-34,-8,68,52,10);ctx.stroke();P('M-20 -8 v-16 a20 20 0 0 1 40 0 v16');}
  if(kind==='phone'){ctx.beginPath();ctx.roundRect(-26,-46,52,92,12);ctx.stroke();P('M-8 32 h16');}
  if(kind==='cloud'){P('M-34 22 h62 a20 20 0 0 0 0 -40 a28 28 0 0 0 -52 -6 a20 20 0 0 0 -10 46 Z');P('M-46 -40 L46 44');}
  if(kind==='shield'){P('M0 -46 L36 -32 V2 C36 26 18 40 0 48 C-18 40 -36 26 -36 2 V-32 Z');P('M-14 2 L-3 13 L16 -8');}
  if(kind==='x'){P('M-22 -22 L22 22 M22 -22 L-22 22');}
  if(kind==='tick'){P('M-26 2 L-8 20 L26 -16');}
  if(kind==='play'){ctx.beginPath();ctx.moveTo(-18,-28);ctx.lineTo(30,0);ctx.lineTo(-18,28);ctx.closePath();ctx.fill();}
  ctx.restore();
}
function chip(x,y,text,bg,fg='#fff',size=22,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=`800 ${size}px Inter`;
  const w=ctx.measureText(text).width+size*1.1,h=size*1.75;
  ctx.beginPath(); ctx.roundRect(x,y-h,w,h,h*0.28); ctx.fillStyle=bg; ctx.fill();
  ctx.fillStyle=fg; ctx.textBaseline='middle'; ctx.fillText(text,x+size*0.55,y-h/2+1); ctx.restore(); return w;
}
function wrapFill(text,x,y,maxW,lh,font,col,align='left'){
  ctx.font=font; ctx.fillStyle=col; ctx.textAlign=align; const words=text.split(' '); let line='',yy=y;
  words.forEach(w=>{const test=line?line+' '+w:w; if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,yy);line=w;yy+=lh;} else line=test;});
  ctx.fillText(line,x,yy); ctx.textAlign='left'; return yy;
}

// ---------- datos precalculados ----------
const motes=[...Array(90)].map(()=>({x:R()*W,y:R()*H,r:0.6+R()*2.2,sp:4+R()*14,ph:R()*7,a:0.15+R()*0.4}));
const rain=[...Array(50)].map(()=>({x:R()*W,sp:1400+R()*900,len:40+R()*70,ph:R()}));
const splash=[...Array(30)].map(()=>{const a=-Math.PI/2+(R()-0.5)*2.3,v=320+R()*520;return{vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+R()*5};});
const bubbles=[...Array(46)].map(()=>({x:R()*W,sp:60+R()*160,r:2+R()*9,ph:R()*7,o:R()*20}));
const larvae=[...Array(7)].map((_,i)=>({x:330+i*210+(R()-0.5)*60,len:150+R()*90,ph:R()*7,t0:9.6+[3,1,5,0,4,2,6][i]*0.15}));
const N=467, N25=306; // 1 punto = 100 casos (46 669 en 2026; 30 587 en el mismo periodo de 2025)
const MPATH=[[960,650],[760,430],[1010,250],[1390,320],[1520,560],[1240,720],[2160,430]];
const MOSQ_T0=14.4,MOSQ_T1=17.9;
const dots=[...Array(N)].map((_,i)=>{const col=Math.floor(i/9),row=i%9;
  return {b:15.0+(i/N)*2.4,jx:(R()-0.5)*170,jy:(R()-0.5)*150,gx:185+col*30,gy:520+row*30,ra:(i/N)*Math.PI*2,rr:470+Math.sin(i*7.31)*26+(R()-0.5)*18,ph:R()*7};});
const confetti=[...Array(56)].map(()=>{const a=-Math.PI/2+(R()-0.5)*2.6,v=300+R()*650;return{vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:[C.tealL,C.review,C.safe,C.teal,'#fff'][Math.floor(R()*5)],w:6+R()*8,h:10+R()*12,rot:R()*7,vr:(R()-0.5)*14};});
const pour=[...Array(50)].map((_,i)=>({e:45.25+(i/50)*1.0,vx:60+R()*90,vy:-40+R()*80,r:2+R()*4}));
const mosqPos=t=>catmull(MPATH,seg(t,MOSQ_T0,MOSQ_T1));

// grano de película (texturas precalculadas)
const grains=[0,1,2,3].map(k=>{const g=document.createElement('canvas'); g.width=480; g.height=270; const gc=g.getContext('2d');
  const im=gc.createImageData(480,270); const rr=mulberry(99+k);
  for(let i=0;i<im.data.length;i+=4){const v=Math.floor(rr()*255); im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255;}
  gc.putImageData(im,0,0); return g;});
function grain(t,alpha){ctx.save(); ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=alpha; ctx.imageSmoothingEnabled=true;
  ctx.drawImage(grains[Math.floor(t*30)%4],0,0,W,H); ctx.restore();}
function vignette(a){const g=ctx.createRadialGradient(960,540,380,960,540,1150); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${a})`); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);}
function drawMotes(t,alpha){motes.forEach(m=>{const y=(m.y-t*m.sp)%H,yy=y<0?y+H:y,x=m.x+Math.sin(t*0.6+m.ph)*18;
  ctx.globalAlpha=alpha*m.a*(0.6+0.4*Math.sin(t*1.7+m.ph)); ctx.fillStyle='rgb(94,234,212)'; ctx.beginPath(); ctx.arc(x,yy,m.r,0,7); ctx.fill();}); ctx.globalAlpha=1;}
function blobs(t,alpha){if(alpha<=0)return; ctx.save(); ctx.globalAlpha=alpha;
  [[300,250,520,0],[1650,820,600,1.7],[1200,150,420,3.1]].forEach(([x,y,r,ph])=>{const xx=x+Math.sin(t*0.3+ph)*90,yy=y+Math.cos(t*0.25+ph)*70;
    const g=ctx.createRadialGradient(xx,yy,0,xx,yy,r); g.addColorStop(0,'rgba(94,234,212,.22)'); g.addColorStop(1,'rgba(94,234,212,0)'); ctx.fillStyle=g; ctx.fillRect(xx-r,yy-r,2*r,2*r);});
  ctx.restore();}

// ============================================================ 01 · EL PROBLEMA (oscuro)
const BUCKET={x:960,y:400,s:1,level:0.6}; const SURF_Y=BUCKET.y+(345-BUCKET.level*300);
const darkBucket={body:'#17221F',stroke:C.tealL,water:'#0E7C72',water2:'#07403B',surf:C.tealC,lw:6,glow:'rgba(94,234,212,.55)',glowBlur:26};
const IMPACT=4.8;
function sceneSurface(t){
  const push=1+0.07*eo(seg(t,0,7.6)), dive=eio(seg(t,7.6,9.8)), z=push*Math.pow(26,dive);
  ctx.save(); ctx.translate(960,lerp(560,540,dive)); ctx.scale(z,z); ctx.translate(-960,-lerp(560,SURF_Y+30,dive));
  const rainA=1-seg(t,4.4,5.8);
  if(rainA>0){ctx.strokeStyle='rgba(204,251,241,.16)'; ctx.lineWidth=2;
    rain.forEach(r=>{const y=((t+r.ph)*r.sp)%(H+200)-100; ctx.globalAlpha=rainA; ctx.beginPath(); ctx.moveTo(r.x,y); ctx.lineTo(r.x-6,y+r.len); ctx.stroke();}); ctx.globalAlpha=1;}
  drawMotes(t,0.9);
  drawBucket(BUCKET.x,BUCKET.y,BUCKET.s,BUCKET.level,darkBucket);
  if(t<IMPACT+0.02){
    const p=seg(t,2.9,IMPACT), f=q=>lerp(-80,SURF_Y,ei(q*0.85+0.15*q*q)), a=eo(seg(t,2.7,3.1));
    for(let k=1;k<=6;k++){const pk=clamp(p-k*0.018); ctx.globalAlpha=a*(0.25-k*0.035); dropPath(960,f(pk),1.1); ctx.fillStyle=C.tealL; ctx.fill();}
    ctx.globalAlpha=a; ctx.shadowColor=C.tealL; ctx.shadowBlur=30; dropPath(960,f(p)-20,1.1); ctx.fillStyle=C.tealC; ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  if(t>=IMPACT){const dt=t-IMPACT;
    splash.forEach(s=>{const x=960+s.vx*dt*0.55,y=SURF_Y-6+s.vy*dt*0.55+0.5*1500*dt*dt*0.55,a=1-seg(dt,0.5,1.1);
      if(a>0&&y<SURF_Y+10){ctx.globalAlpha=a;ctx.fillStyle=C.tealC;ctx.beginPath();ctx.arc(x,y,s.r,0,7);ctx.fill();}});
    for(let i=0;i<5;i++){const p=seg(t,IMPACT+i*0.35,IMPACT+2.8+i*0.35);
      if(p>0&&p<1){const rx=20+eo(p)*150; ctx.globalAlpha=(1-p)*0.9; ctx.strokeStyle=C.tealC; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(960,SURF_Y,rx,rx*0.16,0,0,7); ctx.stroke();}}
    ctx.globalAlpha=1;
    // destello del impacto
    const fl=1-seg(dt,0,0.5); if(fl>0){const g=ctx.createRadialGradient(960,SURF_Y,0,960,SURF_Y,300); g.addColorStop(0,`rgba(204,251,241,${0.5*fl})`); g.addColorStop(1,'rgba(204,251,241,0)'); ctx.fillStyle=g; ctx.fillRect(660,SURF_Y-300,600,600);}
  }
  ctx.restore();
  kText([['Un balde con agua quieta',C.inkD]],960,915,t,5.0,{size:80,out:7.4});
  kText([['puede ser',C.inkD],['un criadero',C.review],['en tu propia casa.',C.inkD]],960,1005,t,6.0,{size:54,weight:700,out:7.5});

    kText([[txt,act?C.inkL:C.mutL]],990,y,t,a+0.05,{size:42,weight:act?800:600,align:'left',maxW:820,lh:52,stagger:0.03,alpha:1-out});
  });
  // insignia y confeti
  if(t>47.2&&t<50.0){const p=eob(seg(t,47.2,47.6)),q=eio(seg(t,49.3,49.8)),bx=px+pw/2-185,by=py+250-eo(seg(t,47.2,49.0))*30;
    ctx.save(); ctx.globalAlpha=clamp(p)*(1-q); ctx.translate(bx,by); ctx.scale(clamp(p,0,1.2),clamp(p,0,1.2));
    ctx.shadowColor='rgba(46,125,50,.35)'; ctx.shadowBlur=30; ctx.shadowOffsetY=10; ctx.font='800 34px Inter'; const txt='+1 alerta atendida',w=ctx.measureText(txt).width+110;
    ctx.beginPath(); ctx.roundRect(0,-40,w,80,40); ctx.fillStyle=C.safe; ctx.fill(); ctx.shadowColor='transparent';
    ctx.beginPath(); ctx.arc(40,0,22,0,7); ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=5; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(38,8); ctx.lineTo(51,-8); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.textBaseline='middle'; ctx.fillText(txt,76,2); ctx.restore();
    const dt=t-47.2; confetti.forEach(c=>{const x=bx+150+c.vx*dt,y=by+c.vy*dt+0.5*1300*dt*dt,a=1-seg(dt,1.1,1.8); if(a<=0)return;
      ctx.save(); ctx.globalAlpha=a; ctx.translate(x,y); ctx.rotate(c.rot+c.vr*dt); ctx.fillStyle=c.c; ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h); ctx.restore();});}

// ============================================================ 03 · VALOR DE LA IA (sin IA vs con IA)
function sceneCompare(t){
  const out=eio(seg(t,57.0,57.6));
  kText([['Lo que cambia',C.inkL],['la IA',C.teal]],960,170,t,50.6,{size:60,out:57.0});
  const cols=[
    {x:140,title:'Sin IA',tc:C.mutL,t0:50.9,items:['Adivinar qué recipiente revisar','Dudas que nadie responde','Ningún registro de tu avance'],ic:'x',icc:'#9AA9A6',dim:true},
    {x:1000,title:'Con Detengue',tc:C.teal,t0:52.4,items:['La cámara detecta cada recipiente y su estado','Te dice qué hacer, y te pregunta si duda','Tu progreso queda en tu teléfono'],ic:'tick',icc:C.teal,dim:false},
  ];
  cols.forEach((c,ci)=>{
    const p=eo(seg(t,c.t0,c.t0+0.5)); if(p<=0) return;
    const dim=c.dim?lerp(1,0.5,eo(seg(t,54.0,54.6))):1;
    const dx=(1-p)*(ci?120:-120);
    ctx.save(); ctx.globalAlpha=p*(1-out)*dim; ctx.translate(dx,0);
    ctx.shadowColor=ci?'rgba(15,118,110,.25)':'rgba(0,0,0,.06)'; ctx.shadowBlur=ci?50:20; ctx.shadowOffsetY=14;
    ctx.beginPath(); ctx.roundRect(c.x,260,780,560,36); ctx.fillStyle=ci?'#FFFFFF':'#EEF2F1'; ctx.fill(); ctx.shadowColor='transparent';
    if(ci){ctx.lineWidth=4; ctx.strokeStyle=C.teal; ctx.globalAlpha*=eo(seg(t,52.6,53.0)); ctx.stroke(); ctx.globalAlpha=p*(1-out)*dim;}
    ctx.font='800 52px Inter'; ctx.fillStyle=c.tc; ctx.fillText(c.title,c.x+56,350);
    ctx.restore();
    c.items.forEach((it,k)=>{
      const q=eo(seg(t,c.t0+0.4+k*0.3,c.t0+0.9+k*0.3)); if(q<=0) return;
      const y=450+k*125;
      ctx.save(); ctx.globalAlpha=q*(1-out)*dim; ctx.translate(dx+(1-q)*30,0);
      ctx.beginPath(); ctx.arc(c.x+86,y-12,30,0,7); ctx.fillStyle=ci?C.tealC:'#DDE3E1'; ctx.fill(); icon(c.ic,c.x+86,y-12,30,c.icc);
      ctx.restore();
      ctx.save(); ctx.globalAlpha=q*(1-out)*dim; wrapFill(it,c.x+140+dx+(1-q)*30,y-4,600,40,`${ci?700:600} 34px Inter`,ci?C.inkL:C.mutL); ctx.restore();
    });
  });
  // flecha central
  const ap=eo(seg(t,52.2,52.6))*(1-out); if(ap>0){ctx.save(); ctx.globalAlpha=ap; ctx.beginPath(); ctx.arc(960,540,34,0,7); ctx.fillStyle=C.teal; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(946,540); ctx.lineTo(974,540); ctx.moveTo(962,526); ctx.lineTo(976,540); ctx.lineTo(962,554); ctx.stroke(); ctx.restore();}
  kText([['La IA convierte un consejo en una',C.inkL],['inspección guiada.',C.teal]],960,935,t,54.4,{size:50,out:57.0});
}

// ============================================================ 04 · VIABLE HOY E IMPACTO
function sceneViable(t){
  const out=eio(seg(t,63.9,64.4));
  const p=eo(seg(t,57.8,58.2));
  if(p>0){ctx.save(); ctx.globalAlpha=p*(1-out); ctx.font='800 200px Inter'; ctx.fillStyle=C.teal; ctx.textBaseline='alphabetic';
    const v=95.7*eexp(seg(t,57.9,59.6)); ctx.fillText(v.toFixed(1).replace('.',',')+' %',150,420); ctx.restore();}
  kText([['de los hogares del Perú tiene un teléfono celular.',C.inkL]],156,500,t,58.5,{size:44,weight:700,align:'left',maxW:760,lh:54,out:63.9});
  kText([['88,1 % en zonas rurales: por eso Detengue',C.mutL],['funciona sin internet.',C.teal]],156,640,t,59.6,{size:34,weight:600,align:'left',maxW:760,lh:44,out:63.9});
  const sp=eo(seg(t,58.6,59.2))*(1-out);
  if(sp>0){ctx.save(); ctx.globalAlpha=sp*0.9; ctx.font='500 22px Inter'; ctx.fillStyle=C.mutL; ctx.fillText('Fuente: INEI, Estadísticas de las TIC en los hogares, IV trimestre 2025.',156,1040); ctx.restore();}
  const chips=[['wifi','Funciona sin internet'],['chip','Modelo de IA de 3 MB'],['phone','En celulares económicos'],['cloud','Sin servidores ni costos de nube'],['lock','Fotos solo en tu celular'],['shield','No diagnostica: te guía']];
  chips.forEach(([k,lab],i)=>{
    const t0=60.0+i*0.3, q=eob(seg(t,t0,t0+0.45)); if(q<=0) return;
    const col=i%2, row=Math.floor(i/2), x=1010+col*410, y=210+row*150;
    ctx.save(); ctx.globalAlpha=clamp(q)*(1-out); const s=lerp(0.7,1,clamp(q,0,1.1)); ctx.translate(x+190,y+60); ctx.scale(s,s); ctx.translate(-x-190,-y-60);
    ctx.shadowColor='rgba(15,118,110,.15)'; ctx.shadowBlur=30; ctx.shadowOffsetY=10; ctx.beginPath(); ctx.roundRect(x,y,380,120,28); ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowColor='transparent';
    ctx.beginPath(); ctx.arc(x+60,y+60,38,0,7); ctx.fillStyle=C.teal; ctx.fill(); icon(k,x+60,y+60,30);
    ctx.restore();
    ctx.save(); ctx.globalAlpha=clamp(q)*(1-out); const lines=wrapFill(lab,x+116,y+54,240,34,'700 28px Inter',C.inkL); ctx.restore();
  });
  kText([['Cada balde volteado',C.inkL]],1420,740,t,62.0,{size:48,out:63.9});
  kText([['es un criadero menos.',C.teal]],1420,800,t,62.3,{size:48,out:63.9});
  // barra de impacto: "un criadero menos" acumulado
  const ip=eo(seg(t,62.4,63.6))*(1-out); if(ip>0){ctx.save(); ctx.globalAlpha=ip; for(let i=0;i<10;i++){const q=eob(seg(t,62.6+i*0.08,63.0+i*0.08)); if(q<=0) continue;
    const x=1100+i*72, y=860; ctx.save(); ctx.translate(x,y); ctx.scale(clamp(q,0,1.2)*0.16,clamp(q,0,1.2)*0.16); drawBucket(0,0,1,0,{body:'#E6F4F1',stroke:C.teal,lw:14},Math.PI); ctx.restore();}
    ctx.restore();}
}

// ============================================================ CIERRE → DEMO
function sceneClose(t){
  const lv=eio(seg(t,64.1,64.8));
  if(lv>0){const top=lerp(H+120,-200,lv);
    ctx.fillStyle=C.tealL; ctx.beginPath(); ctx.moveTo(0,H); for(let x=0;x<=W;x+=20) ctx.lineTo(x,top-70+Math.sin(x*0.011-t*3.4)*26); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C.teal; ctx.beginPath(); ctx.moveTo(0,H); for(let x=0;x<=W;x+=20) ctx.lineTo(x,top+Math.sin(x*0.008+t*4)*34+Math.sin(x*0.019-t*3)*14); ctx.lineTo(W,H); ctx.closePath(); ctx.fill();}
  if(t<64.6) return;
  const fadeAll=eio(seg(t,67.2,67.8));
  const words=[['Revisa.',64.8],['Vacía.',65.4],['Repite.',66.0]];
  ctx.save(); ctx.font='800 150px Inter'; ctx.textBaseline='alphabetic';
  const sp=48,widths=words.map(([w])=>ctx.measureText(w).width),total=widths.reduce((a,b)=>a+b,0)+sp*2; let x=960-total/2;
  words.forEach(([w,t0],i)=>{const p=eob(seg(t,t0,t0+0.4)),s=lerp(1.7,1,clamp(p)),cx=x+widths[i]/2;
    ctx.save(); ctx.globalAlpha=clamp(p*1.4)*(1-fadeAll); ctx.filter=fadeAll>0.02?`blur(${(fadeAll*16).toFixed(1)}px)`:'none'; ctx.translate(cx,600); ctx.scale(s,s); ctx.fillStyle='#fff'; ctx.fillText(w,-widths[i]/2,0); ctx.restore();
    const rp=seg(t,t0+0.1,t0+1.0); if(rp>0&&rp<1){ctx.save(); ctx.globalAlpha=(1-rp)*0.5*(1-fadeAll); ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(cx,555,widths[i]*0.3+rp*260,60+rp*120,0,0,7); ctx.stroke(); ctx.restore();}
    x+=widths[i]+sp;});
  ctx.restore();
  const lp=eob(seg(t,66.5,67.0)); if(lp>0) drawLogo(960,290,90*clamp(lp,0,1.2),'#FFFFFF',C.teal,'#FFFFFF',eo(seg(t,66.7,67.1)),clamp(lp)*(1-fadeAll));
  kText([['Detengue',C.tealC]],960,775,t,66.6,{size:70,weight:800,alpha:1-fadeAll});
  // breakdown: oscurece
  const dk=eio(seg(t,67.2,68.0));
  if(dk>0){ctx.fillStyle=`rgba(6,16,15,${dk})`; ctx.fillRect(0,0,W,H);}
  if(t>67.4){
    kText([['Y esto no son solo palabras.',C.inkD]],960,520,t,67.8,{size:68,weight:700,out:69.4,stagger:0.09});
    // rayos detrás de "realidad"
    const rp=eo(seg(t,69.7,70.6));
    if(rp>0){ctx.save(); ctx.globalAlpha=rp*0.9; ctx.translate(960,500); ctx.rotate(t*0.08); ctx.globalCompositeOperation='lighter';
      for(let k=0;k<14;k++){ctx.rotate(Math.PI*2/14); const g=ctx.createLinearGradient(0,0,0,-900); g.addColorStop(0,'rgba(94,234,212,.16)'); g.addColorStop(1,'rgba(94,234,212,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(14,0); ctx.lineTo(90,-900); ctx.lineTo(-90,-900); ctx.closePath(); ctx.fill();}
      ctx.restore();
      const g2=ctx.createRadialGradient(960,500,0,960,500,520); g2.addColorStop(0,`rgba(15,118,110,${0.55*rp})`); g2.addColorStop(1,'rgba(15,118,110,0)'); ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);}
    kText([['Ya es una',C.inkD],['realidad.',C.tealL]],960,560,t,69.8,{size:132,weight:800,stagger:0.12,glow:'rgba(94,234,212,.55)',glowBlur:40});
    const pp=eob(seg(t,71.0,71.5));
    if(pp>0){const pulse=1+0.06*Math.sin((t-71)*Math.PI*2/1.2);
      ctx.save(); ctx.globalAlpha=clamp(pp); ctx.translate(800,760); ctx.scale(clamp(pp,0,1.2)*pulse,clamp(pp,0,1.2)*pulse);
      ctx.shadowColor='rgba(94,234,212,.7)'; ctx.shadowBlur=40; ctx.beginPath(); ctx.arc(0,0,44,0,7); ctx.fillStyle=C.teal; ctx.fill(); ctx.shadowColor='transparent'; icon('play',4,0,34); ctx.restore();}
    kText([['Míralo funcionando.',C.inkD]],870,778,t,71.1,{size:48,weight:700,align:'left'});
  }
  // destello final en el último golpe
  const fl=seg(t,72.0,72.08)*(1-seg(t,72.08,72.7)); if(fl>0){ctx.fillStyle=`rgba(204,251,241,${0.35*fl})`; ctx.fillRect(0,0,W,H);}
}

// ============================================================ capítulos (claridad de la estructura)
const CHAPTERS=[[5.6,'01','El problema'],[WIPE,'02','La solución'],[50.4,'03','El valor de la IA'],[57.6,'04','Viable hoy']];
function chapterUI(t){
  if(t<5.6||t>64.2) return;
  const vis=eo(seg(t,5.6,6.2))*(1-eio(seg(t,63.8,64.2)));
  let ci=0; CHAPTERS.forEach((c,i)=>{if(t>=c[0]) ci=i;});
  const dark=t<WIPE+0.5;
  ctx.save(); ctx.globalAlpha=vis;
  const x=1800;
  CHAPTERS.forEach((c,i)=>{
    const tin=c[0], next=CHAPTERS[i+1]?CHAPTERS[i+1][0]:99;
    const pin=eo(seg(t,tin,tin+0.5)), pout=eio(seg(t,next,next+0.4));
    const a=pin*(1-pout); if(a<=0) return;
    ctx.save(); ctx.globalAlpha=vis*a; const dy=(1-pin)*24-pout*24;
    ctx.textAlign='right'; ctx.textBaseline='alphabetic';
    ctx.font='800 22px Inter'; ctx.fillStyle=dark?C.tealL:C.teal; ctx.fillText(c[1],x-ctx.measureText(' '+c[2]).width-6,96+dy);
    ctx.font='700 22px Inter'; ctx.fillStyle=dark?C.inkD:C.inkL; ctx.fillText(' '+c[2],x,96+dy);
    ctx.restore();
  });
  // progreso
  for(let i=0;i<4;i++){const tin=CHAPTERS[i][0],tend=CHAPTERS[i+1]?CHAPTERS[i+1][0]:64.2, f=seg(t,tin,tend);
    const xx=x-4*52+i*52+8; ctx.globalAlpha=vis*0.35; ctx.fillStyle=dark?C.mutD:'#9AA9A6'; ctx.fillRect(xx,112,44,4);
    ctx.globalAlpha=vis; ctx.fillStyle=dark?C.tealL:C.teal; ctx.fillRect(xx,112,44*f,4);}
  ctx.restore();
}

// ============================================================ composición
const PUNCH=[4.8,21.6,WIPE,64.8,65.4,66.0,72.0];
function punch(t){let s=0; PUNCH.forEach(p=>{if(t>=p) s+=0.014*Math.exp(-(t-p)*7);}); return 1+s;}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.filter='none'; ctx.globalCompositeOperation='source-over';
  const light=t>=WIPE+0.65;
  ctx.fillStyle=light?C.bgL:C.bgD; ctx.fillRect(0,0,W,H);
  const z=punch(t); ctx.translate(960,540); ctx.scale(z,z); ctx.translate(-960,-540);
  if(!light){
    if(t<10.0) sceneSurface(t);
    if(t>=8.4&&t<15.6) sceneUnderwater(t);
    if(t>=14.0) drawMotes(t,0.5*seg(t,14.6,16));
    if(t>=14.4) sceneData(t);
    vignette(lerp(0.55,0.3,seg(t,17.5,18.5)*(1-seg(t,24.6,25.6))));
  } else blobs(t,eo(seg(t,WIPE+0.7,WIPE+1.9))*(1-seg(t,64.0,64.8)));
  if(t>=32.4&&t<64.9) sceneDropToLogo(t);
  if(t>=38.1&&t<50.7) scenePhone(t);
  if(t>=50.4&&t<57.7) sceneCompare(t);
  if(t>=57.6&&t<64.5) sceneViable(t);
  if(t>=64.0) sceneClose(t);
  ctx.setTransform(1,0,0,1,0,0);
  chapterUI(t);
  grain(t,light&&t<67.2?0.10:0.16);
  const fi=1-seg(t,0,0.9); if(fi>0){ctx.globalAlpha=fi; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;}
  const fo=seg(t,72.5,73.0); if(fo>0){ctx.globalAlpha=fo; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;}
}
window.DURATION=DURATION; window.setTime=t=>draw(t);
window.ready=document.fonts.load('800 80px Inter').then(()=>document.fonts.load('500 30px Inter')).then(()=>document.fonts.load('700 30px Inter')).then(()=>document.fonts.load('600 30px Inter')).then(()=>{draw(0);return true;});
</script>
