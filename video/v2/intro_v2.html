<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Detengue — intro v2</title>
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
/* =====================================================================
   Detengue — intro v2. Un solo plano continuo, determinista: draw(t).
   ===================================================================== */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 1920, H = 1080;
const DURATION = 58.4;

const C = {
  teal:'#0F766E', tealL:'#5EEAD4', tealC:'#CCFBF1', tealD:'#0B4F4A',
  bgL:'#F7FAF9', inkL:'#10201E', mutL:'#3F4F4C', varL:'#E2ECEA',
  bgD:'#0E1514', inkD:'#E2ECEA', mutD:'#BFCDCA', varD:'#26332F',
  safe:'#2E7D32', review:'#F59E0B', risk:'#C62828', riskS:'#EF7B7B',
};

// ---------- utilidades ----------
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const eo=p=>1-Math.pow(1-clamp(p),3);
const ei=p=>Math.pow(clamp(p),3);
const eio=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const eob=p=>{p=clamp(p);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eexp=p=>{p=clamp(p);return p===1?1:1-Math.pow(2,-10*p)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry(20261003);
const hex2rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,p)=>{const A=hex2rgb(a),B=hex2rgb(b);return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],clamp(p)))).join(',')})`};
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
function catmull(P,u){
  const n=P.length-1, x=clamp(u)*n, i=Math.min(Math.floor(x),n-1), f=x-i;
  const p0=P[Math.max(i-1,0)],p1=P[i],p2=P[i+1],p3=P[Math.min(i+2,n)];
  const c=(a,b,c2,d)=>0.5*((2*b)+(-a+c2)*f+(2*a-5*b+4*c2-d)*f*f+(-a+3*b-3*c2+d)*f*f*f);
  return [c(p0[0],p1[0],p2[0],p3[0]),c(p0[1],p1[1],p2[1],p3[1])];
}

// ---------- texto cinético ----------
function layoutWords(segs,size,weight,maxW){
  ctx.font=`${weight} ${size}px Inter`;
  const words=[];
  segs.forEach(([txt,col])=>txt.split(' ').filter(Boolean).forEach(w=>words.push({w,c:col})));
  const space=ctx.measureText(' ').width;
  const lines=[]; let cur={words:[],width:0};
  words.forEach(o=>{
    o.width=ctx.measureText(o.w).width;
    const add=(cur.words.length?space:0)+o.width;
    if(maxW&&cur.width+add>maxW&&cur.words.length){lines.push(cur);cur={words:[o],width:o.width};}
    else{cur.words.push(o);cur.width+=add;}
  });
  lines.push(cur);
  return {lines,space};
}
function kText(segs,x,y,t,t0,o={}){
  const size=o.size||64, weight=o.weight||800, lh=o.lh||size*1.2, align=o.align||'center';
  const st=o.stagger??0.06, dur=o.dur??0.6, out=o.out, am=o.alpha??1, rise=o.rise??34;
  if(t<t0-0.01) return;
  const {lines,space}=layoutWords(segs,size,weight,o.maxW);
  ctx.save(); ctx.font=`${weight} ${size}px Inter`; ctx.textBaseline='alphabetic';
  let k=0;
  lines.forEach((ln,li)=>{
    let cx=align==='center'?x-ln.width/2:x;
    const ly=y+li*lh;
    ln.words.forEach(w=>{
      const s0=t0+k*st, p=eo(seg(t,s0,s0+dur));
      let q=0; if(out!=null) q=eio(seg(t,out+k*0.025,out+k*0.025+0.45));
      const a=p*(1-q)*am;
      if(a>0.004){
        ctx.globalAlpha=a;
        const bl=(1-p)*14+q*14;
        ctx.filter=bl>0.4?`blur(${bl.toFixed(1)}px)`:'none';
        ctx.fillStyle=w.c||o.color||'#fff';
        ctx.fillText(w.w,cx,ly+(1-p)*rise-q*24);
      }
      cx+=w.width+space; k++;
    });
  });
  ctx.restore();
}

// ---------- formas ----------
function bucketPath(close){
  ctx.beginPath();
  ctx.moveTo(-180,0); ctx.lineTo(-135,320); ctx.quadraticCurveTo(-132,345,-105,345);
  ctx.lineTo(105,345); ctx.quadraticCurveTo(132,345,135,320); ctx.lineTo(180,0);
  if(close) ctx.closePath();
}
function drawBucket(x,y,s,level,st,rot=0,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y); ctx.scale(s,s);
  if(rot){ctx.translate(0,172);ctx.rotate(rot);ctx.translate(0,-172);}
  ctx.lineJoin='round'; ctx.lineCap='round';
  if(st.glow){ctx.shadowColor=st.glow;ctx.shadowBlur=st.glowBlur||24;}
  ctx.strokeStyle=st.stroke; ctx.lineWidth=st.lw||6;
  ctx.beginPath(); ctx.moveTo(-170,14); ctx.quadraticCurveTo(0,-190,170,14); ctx.lineWidth=(st.lw||6)*1.5; ctx.stroke();
  ctx.lineWidth=st.lw||6;
  ctx.shadowBlur=0;
  bucketPath(true); ctx.fillStyle=st.body; ctx.fill();
  if(level>0.005){
    const sy=345-level*300;
    ctx.save(); bucketPath(true); ctx.clip();
    const g=ctx.createLinearGradient(0,sy,0,345); g.addColorStop(0,st.water); g.addColorStop(1,st.water2||st.water);
    ctx.fillStyle=g; ctx.fillRect(-220,sy,440,420);
    ctx.restore();
    const hw=180-45*(sy/320)-6;
    ctx.beginPath(); ctx.ellipse(0,sy,hw,hw*0.16,0,0,Math.PI*2); ctx.fillStyle=st.surf; ctx.globalAlpha*=0.6; ctx.fill(); ctx.globalAlpha/=0.6;
  }
  if(st.glow){ctx.shadowColor=st.glow;ctx.shadowBlur=st.glowBlur||24;}
  bucketPath(false); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(0,0,180,28,0,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}
function dropPath(cx,cy,s){ // gota del logo, centrada en (cx,cy)
  const X=v=>cx+(v-54)*s, Y=v=>cy+(v-51)*s;
  ctx.beginPath();
  ctx.moveTo(X(54),Y(28));
  ctx.bezierCurveTo(X(54),Y(28),X(38),Y(46),X(38),Y(58));
  ctx.bezierCurveTo(X(38),Y(66.8),X(45.2),Y(74),X(54),Y(74));
  ctx.bezierCurveTo(X(62.8),Y(74),X(70),Y(66.8),X(70),Y(58));
  ctx.bezierCurveTo(X(70),Y(46),X(54),Y(28),X(54),Y(28));
  ctx.closePath();
}
function drawLogo(cx,cy,r,bg,fg,ck,checkP=1,alpha=1){
  const s=r/50;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fillStyle=bg; ctx.fill();
  dropPath(cx,cy-3*s,s); ctx.fillStyle=fg; ctx.fill();
  if(checkP>0) drawCheck(cx,cy,s,ck,checkP);
  ctx.restore();
}
function drawCheck(cx,cy,s,col,p){
  const pts=[[-7,4],[-1.5,9.5],[7,-1]].map(([a,b])=>[cx+a*s,cy+b*s]);
  const l1=Math.hypot(pts[1][0]-pts[0][0],pts[1][1]-pts[0][1]), l2=Math.hypot(pts[2][0]-pts[1][0],pts[2][1]-pts[1][1]);
  ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=4*s; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.setLineDash([l1+l2,l1+l2]); ctx.lineDashOffset=(l1+l2)*(1-clamp(p));
  ctx.beginPath(); ctx.moveTo(...pts[0]); ctx.lineTo(...pts[1]); ctx.lineTo(...pts[2]); ctx.stroke(); ctx.restore();
}
function drawMosquito(x,y,s,t,dir=1,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.translate(x,y); ctx.scale(s*dir,s);
  ctx.lineCap='round';
  // patas largas con bandas
  for(let i=0;i<3;i++){
    const sw=Math.sin(t*9+i)*3;
    const a=[-4+i*7,6], b=[-26+i*20+sw,26], c=[-46+i*36+sw,52];
    ctx.strokeStyle='#C7D3D0'; ctx.lineWidth=2.4;
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.lineTo(...c); ctx.stroke();
    ctx.strokeStyle='#0E1514'; ctx.lineWidth=2.6; ctx.setLineDash([3,6]);
    ctx.beginPath(); ctx.moveTo(...b); ctx.lineTo(...c); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.shadowColor='rgba(94,234,212,.9)'; ctx.shadowBlur=18;
  // abdomen
  ctx.save(); ctx.translate(-26,2); ctx.rotate(-0.18);
  ctx.beginPath(); ctx.ellipse(0,0,30,8.5,0,0,Math.PI*2); ctx.fillStyle='#DCE6E3'; ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='#0E1514'; ctx.lineWidth=3;
  for(let k=-2;k<=2;k++){ctx.beginPath();ctx.moveTo(k*10,-8);ctx.lineTo(k*10+2,8);ctx.stroke();}
  ctx.restore();
  ctx.shadowColor='rgba(94,234,212,.9)'; ctx.shadowBlur=18;
  // tórax y cabeza
  ctx.beginPath(); ctx.ellipse(6,-2,13,11,0,0,Math.PI*2); ctx.fillStyle='#2A3936'; ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#F2F7F6'; ctx.lineWidth=1.8;
  ctx.beginPath(); ctx.moveTo(1,-9); ctx.quadraticCurveTo(-2,-2,2,5); ctx.moveTo(11,-9); ctx.quadraticCurveTo(14,-2,10,5); ctx.stroke();
  ctx.beginPath(); ctx.arc(22,1,7,0,Math.PI*2); ctx.fillStyle='#2A3936'; ctx.fill();
  ctx.strokeStyle='#C7D3D0'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(27,4); ctx.lineTo(50,13); ctx.stroke();
  // alas
  const flap=Math.abs(Math.sin(t*80));
  ctx.fillStyle='rgba(204,251,241,.28)'; ctx.strokeStyle='rgba(204,251,241,.75)'; ctx.lineWidth=1.4;
  for(const side of [-1,1]){
    ctx.save(); ctx.translate(2,-8); ctx.rotate(-0.45+side*0.12-flap*0.35);
    ctx.beginPath(); ctx.ellipse(-24,0,28,4+flap*7,0,0,Math.PI*2); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  ctx.restore();
}
function drawLarva(x,yTop,len,t,ph,alpha){
  ctx.save(); ctx.globalAlpha*=alpha;
  const n=14, pts=[];
  for(let j=0;j<=n;j++){
    const f=j/n;
    pts.push([x+Math.sin(t*6.5+ph-j*0.55)*f*16+Math.sin(ph)*f*10, yTop+f*len]);
  }
  ctx.shadowColor='rgba(94,234,212,.8)'; ctx.shadowBlur=14;
  ctx.strokeStyle='rgba(204,251,241,.92)'; ctx.lineCap='round';
  for(let j=0;j<n;j++){
    ctx.lineWidth=lerp(3,8,j/n);
    ctx.beginPath(); ctx.moveTo(...pts[j]); ctx.lineTo(...pts[j+1]); ctx.stroke();
  }
  const hd=pts[n];
  ctx.beginPath(); ctx.arc(hd[0],hd[1]+4,8,0,Math.PI*2); ctx.fillStyle='rgba(204,251,241,.95)'; ctx.fill();
  ctx.shadowBlur=0; ctx.lineWidth=1.2; ctx.strokeStyle='rgba(204,251,241,.6)';
  for(let j=3;j<n;j+=2){const p=pts[j];ctx.beginPath();ctx.moveTo(p[0]-9,p[1]-3);ctx.lineTo(p[0]+9,p[1]+3);ctx.stroke();}
  ctx.restore();
}
function icon(kind,cx,cy,r,col='#fff'){
  const s=r/76;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s);
  ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=9; ctx.lineCap='round'; ctx.lineJoin='round';
  const P=d=>{ctx.stroke(new Path2D(d));};
  if(kind==='ok'){ctx.beginPath();ctx.arc(0,0,38,0,Math.PI*2);ctx.stroke();P('M-18 2 L-4 16 L20 -14');}
  if(kind==='chip'){ctx.beginPath();ctx.roundRect(-30,-30,60,60,10);ctx.stroke();P('M-14 -46 v16 M14 -46 v16 M-14 30 v16 M14 30 v16 M-46 -14 h16 M-46 14 h16 M30 -14 h16 M30 14 h16');}
  if(kind==='wifi'){P('M-44 -10 Q0 -50 44 -10 M-26 10 Q0 -12 26 10');ctx.beginPath();ctx.arc(0,30,5,0,7);ctx.fill();P('M-48 -44 L48 48');}
  if(kind==='lock'){ctx.beginPath();ctx.roundRect(-34,-8,68,52,10);ctx.stroke();P('M-20 -8 v-16 a20 20 0 0 1 40 0 v16');}
  ctx.restore();
}
function chip(x,y,text,bg,fg='#fff',size=22,alpha=1){
  ctx.save(); ctx.globalAlpha*=alpha; ctx.font=`800 ${size}px Inter`;
  const w=ctx.measureText(text).width+size*1.1, h=size*1.75;
  ctx.beginPath(); ctx.roundRect(x,y-h,w,h,h*0.28); ctx.fillStyle=bg; ctx.fill();
  ctx.fillStyle=fg; ctx.textBaseline='middle'; ctx.fillText(text,x+size*0.55,y-h/2+1); ctx.restore();
  return w;
}

// ---------- datos precalculados ----------
const motes=[...Array(90)].map(()=>({x:R()*W,y:R()*H,r:0.6+R()*2.2,sp:4+R()*14,ph:R()*7,a:0.15+R()*0.4}));
const rain=[...Array(46)].map(()=>({x:R()*W,sp:1400+R()*900,len:40+R()*70,ph:R()}));
const splash=[...Array(30)].map(()=>{const a=-Math.PI/2+(R()-0.5)*2.3;const v=320+R()*520;return{vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+R()*5};});
const bubbles=[...Array(46)].map(()=>({x:R()*W,sp:60+R()*160,r:2+R()*9,ph:R()*7,o:R()*20}));
const larvae=[...Array(7)].map((_,i)=>({x:330+i*210+(R()-0.5)*60,len:150+R()*90,ph:R()*7,t0:9.9+[3,1,5,0,4,2,6][i]*0.16}));
const N=467;  // 1 punto = 100 casos  (46 669 / 100)
const N25=306; // 30 587 / 100
const MPATH=[[960,650],[760,430],[1010,250],[1390,320],[1520,560],[1240,720],[2160,430]];
const MOSQ_T0=14.4, MOSQ_T1=17.9;
const dots=[...Array(N)].map((_,i)=>{
  const col=Math.floor(i/9), row=i%9;
  return {b:15.0+(i/N)*2.55, jx:(R()-0.5)*170, jy:(R()-0.5)*150, gx:185+col*30, gy:520+row*30,
          ra:(i/N)*Math.PI*2, rr:470+Math.sin(i*7.31)*26+(R()-0.5)*18, ph:R()*7};
});
const confetti=[...Array(46)].map(()=>{const a=-Math.PI/2+(R()-0.5)*2.6,v=300+R()*600;return{vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:[C.tealL,C.review,C.safe,C.teal,'#fff'][Math.floor(R()*5)],w:6+R()*8,h:10+R()*12,rot:R()*7,vr:(R()-0.5)*14};});
const pour=[...Array(46)].map((_,i)=>({e:41.55+(i/46)*0.9,vx:60+R()*90,vy:-40+R()*80,r:2+R()*4}));

function mosqPos(t){ return catmull(MPATH, seg(t,MOSQ_T0,MOSQ_T1)); }

// ============================================================
// ACTO I — el problema (fondo oscuro)
// ============================================================
const BUCKET={x:960,y:400,s:1,level:0.6};
const SURF_Y=BUCKET.y+BUCKET.s*(345-BUCKET.level*300); // 565
const darkBucket={body:'#17221F',stroke:C.tealL,water:'#0E7C72',water2:'#07403B',surf:C.tealC,lw:6,glow:'rgba(94,234,212,.55)',glowBlur:26};

function drawMotes(t,alpha,col='94,234,212'){
  motes.forEach(m=>{
    const y=(m.y-t*m.sp)%H; const yy=y<0?y+H:y;
    const x=m.x+Math.sin(t*0.6+m.ph)*18;
    ctx.globalAlpha=alpha*m.a*(0.6+0.4*Math.sin(t*1.7+m.ph));
    ctx.fillStyle=`rgb(${col})`; ctx.beginPath(); ctx.arc(x,yy,m.r,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}
function sceneSurface(t){ // 0–10 s
  // cámara: empuje lento y luego zambullida en el agua
  const push=1+0.07*eo(seg(t,0,8));
  const dive=eio(seg(t,7.9,10.1));
  const z=push*Math.pow(26,dive);
  ctx.save();
  ctx.translate(960,lerp(560,540,dive)); ctx.scale(z,z); ctx.translate(-960,-lerp(560,SURF_Y,dive));
  // lluvia
  const rainA=1-seg(t,3.6,5.0);
  if(rainA>0){
    ctx.strokeStyle='rgba(204,251,241,.16)'; ctx.lineWidth=2;
    rain.forEach(r=>{const y=((t+r.ph)*r.sp)%(H+200)-100; ctx.globalAlpha=rainA; ctx.beginPath(); ctx.moveTo(r.x,y); ctx.lineTo(r.x-6,y+r.len); ctx.stroke();});
    ctx.globalAlpha=1;
  }
  drawMotes(t,0.9);
  // balde
  drawBucket(BUCKET.x,BUCKET.y,BUCKET.s,BUCKET.level,darkBucket);
  // gota que cae
  if(t<4.02){
    const p=seg(t,1.0,4.0); const y=lerp(-80,SURF_Y,ei(p*0.85+0.15*p*p));
    const a=eo(seg(t,0.8,1.2));
    for(let k=1;k<=6;k++){ // estela
      const pk=clamp(p-k*0.018); const yk=lerp(-80,SURF_Y,ei(pk*0.85+0.15*pk*pk));
      ctx.globalAlpha=a*(0.25-k*0.035); dropPath(960,yk,1.1); ctx.fillStyle=C.tealL; ctx.fill();
    }
    ctx.globalAlpha=a; ctx.shadowColor=C.tealL; ctx.shadowBlur=30;
    dropPath(960,y-20,1.1); ctx.fillStyle=C.tealC; ctx.fill(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  }
  // salpicadura y ondas
  if(t>=4.0){
    const dt=t-4.0;
    splash.forEach(s=>{
      const x=960+s.vx*dt*0.55, y=SURF_Y-6+s.vy*dt*0.55+0.5*1500*dt*dt*0.55;
      const a=1-seg(dt,0.5,1.1);
      if(a>0&&y<SURF_Y+10){ctx.globalAlpha=a;ctx.fillStyle=C.tealC;ctx.beginPath();ctx.arc(x,y,s.r,0,7);ctx.fill();}
    });
    for(let i=0;i<5;i++){
      const p=seg(t,4.0+i*0.35,6.8+i*0.35);
      if(p>0&&p<1){const rx=20+eo(p)*150; ctx.globalAlpha=(1-p)*0.9; ctx.strokeStyle=C.tealC; ctx.lineWidth=3;
        ctx.beginPath(); ctx.ellipse(960,SURF_Y,rx,rx*0.16,0,0,7); ctx.stroke();}
    }
    ctx.globalAlpha=1;
  }
  ctx.restore();
  // texto (fuera de la cámara)
  kText([['Un balde con agua quieta',C.inkD]],960,915,t,4.5,{size:80,out:7.4});
  kText([['puede convertirse en',C.inkD],['un criadero.',C.review]],960,1010,t,5.6,{size:56,weight:700,out:7.5});
}
function underwaterBG(t,dy){
  const g=ctx.createLinearGradient(0,dy,0,H+dy); g.addColorStop(0,'#0A4F48'); g.addColorStop(0.45,'#063530'); g.addColorStop(1,'#021513');
  ctx.fillStyle=g; ctx.fillRect(0,dy,W,H*1.4);
  // rayos de luz
  ctx.save(); ctx.globalCompositeOperation='lighter';
  for(let k=0;k<7;k++){
    const x0=150+k*270+Math.sin(t*0.5+k)*60, sw=Math.sin(t*0.7+k*1.3)*80;
    const gr=ctx.createLinearGradient(0,dy,0,dy+900); gr.addColorStop(0,'rgba(204,251,241,.10)'); gr.addColorStop(1,'rgba(204,251,241,0)');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(x0-30,dy+120); ctx.lineTo(x0+30,dy+120); ctx.lineTo(x0+160+sw,dy+1000); ctx.lineTo(x0-60+sw,dy+1000); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  // superficie ondulada (vista desde abajo)
  ctx.save(); ctx.beginPath(); ctx.moveTo(0,dy);
  for(let x=0;x<=W;x+=24) ctx.lineTo(x,dy+132+Math.sin(x*0.012+t*2.2)*7+Math.sin(x*0.031-t*1.6)*4);
  ctx.lineTo(W,dy); ctx.closePath(); ctx.fillStyle='rgba(94,234,212,.20)'; ctx.fill();
  ctx.strokeStyle='rgba(204,251,241,.65)'; ctx.lineWidth=3; ctx.beginPath();
  for(let x=0;x<=W;x+=24){const y=dy+132+Math.sin(x*0.012+t*2.2)*7+Math.sin(x*0.031-t*1.6)*4; x?ctx.lineTo(x,y):ctx.moveTo(x,y);} ctx.stroke(); ctx.restore();
  // burbujas
  bubbles.forEach(b=>{
    const y=dy+H-((t*b.sp+b.o*40)%(H-120));
    const x=b.x+Math.sin(t*2+b.ph)*10;
    ctx.globalAlpha=0.55; ctx.strokeStyle=C.tealC; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(x,y,b.r,0,7); ctx.stroke();
  });
  ctx.globalAlpha=1;
}
function sceneUnderwater(t){ // 8.9–15.3

  ];
  items.forEach(([k,ti,sub],i)=>{
    const t0=46.95+i*1.32, p=eo(seg(t,t0,t0+0.42)), q=eio(seg(t,i<3?t0+1.08:52.0,i<3?t0+1.36:52.4));
    const a=p*(1-q); if(a<=0.003) return;
    const dx=(1-p)*180-q*180, bl=(1-p)*16+q*16;
    ctx.save(); ctx.globalAlpha=a; ctx.filter=bl>0.4?`blur(${bl.toFixed(1)}px)`:'none'; ctx.translate(dx,0);
    const sc=lerp(0.7,1,eob(p));
    ctx.save(); ctx.translate(960,430); ctx.scale(sc,sc);
    ctx.shadowColor='rgba(15,118,110,.35)'; ctx.shadowBlur=50; ctx.shadowOffsetY=16;
    ctx.beginPath(); ctx.arc(0,0,110,0,7); ctx.fillStyle=C.teal; ctx.fill(); ctx.shadowColor='transparent';
    icon(k,0,0,96); ctx.restore();
    ctx.font='800 124px Inter'; ctx.textAlign='center'; ctx.fillStyle=C.inkL; ctx.fillText(ti,960,680);
    ctx.font='500 46px Inter'; ctx.fillStyle=C.mutL; ctx.fillText(sub,960,760);
    ctx.restore();
  });
  // progreso
  const pa=eo(seg(t,46.9,47.3))*(1-eio(seg(t,52.0,52.4)));
  const ws=[0,1,2,3].map(i=>{const a0=46.95+i*1.32; return lerp(16,52,eo(seg(t,a0,a0+0.3))*(i===3?1:1-eo(seg(t,a0+1.32,a0+1.62))));});
  let xx=960-(ws.reduce((a,b)=>a+b,0)+3*14)/2;
  ws.forEach(w=>{ctx.globalAlpha=pa; ctx.fillStyle=w>30?C.teal:'#C9D6D2'; ctx.beginPath(); ctx.roundRect(xx,900,w,14,7); ctx.fill(); xx+=w+14;});
  ctx.globalAlpha=1;
}
function sceneClose(t){ // 52.3–58.4
  const lv=eio(seg(t,52.3,53.3));
  if(lv>0){
    const top=lerp(H+120,-140,lv);
    ctx.fillStyle=C.tealL; ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=20) ctx.lineTo(x,top-70+Math.sin(x*0.011-t*3.4)*26);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
    ctx.fillStyle=C.teal; ctx.beginPath(); ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=20) ctx.lineTo(x,top+Math.sin(x*0.008+t*4)*34+Math.sin(x*0.019-t*3)*14);
    ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  }
  if(t<53.2) return;
  // palabras
  const words=[['Revisa.',53.4],['Vacía.',53.9],['Repite.',54.4]];
  ctx.save(); ctx.font='800 150px Inter'; ctx.textBaseline='alphabetic';
  const sp=48, widths=words.map(([w])=>ctx.measureText(w).width), total=widths.reduce((a,b)=>a+b,0)+sp*2;
  let x=960-total/2;
  words.forEach(([w,t0],i)=>{
    const p=eob(seg(t,t0,t0+0.45)), s=lerp(1.7,1,clamp(p));
    const cx=x+widths[i]/2;
    ctx.save(); ctx.globalAlpha=clamp(p*1.4); ctx.translate(cx,600); ctx.scale(s,s); ctx.fillStyle='#fff'; ctx.fillText(w,-widths[i]/2,0); ctx.restore();
    const rp=seg(t,t0+0.12,t0+1.0); if(rp>0&&rp<1){ctx.save(); ctx.globalAlpha=(1-rp)*0.5; ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.ellipse(cx,555,widths[i]*0.3+rp*260,60+rp*120,0,0,7); ctx.stroke(); ctx.restore();}
    x+=widths[i]+sp;
  });
  ctx.restore();
  const lp=eob(seg(t,55.0,55.6));
  if(lp>0) drawLogo(960,290,90*clamp(lp,0,1.2),'#FFFFFF','#0F766E','#FFFFFF',eo(seg(t,55.3,55.8)),clamp(lp));
  kText([['Detengue',C.tealC]],960,775,t,55.5,{size:70,weight:800});
  kText([['Detengue no diagnostica dengue ni reemplaza una inspección sanitaria.','rgba(255,255,255,.85)']],960,1000,t,55.9,{size:28,weight:500,stagger:0.02});
}

// ============================================================
function vignette(alpha){
  const g=ctx.createRadialGradient(960,540,380,960,540,1150); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,`rgba(0,0,0,${alpha})`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
}
function draw(t){
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.filter='none'; ctx.globalCompositeOperation='source-over';
  const light=t>=32.25;
  ctx.fillStyle=light?C.bgL:C.bgD; ctx.fillRect(0,0,W,H);
  if(!light){
    if(t<10.2) sceneSurface(t);
    if(t>=8.5&&t<15.4) sceneUnderwater(t);
    if(t>=14.2) drawMotes(t,0.5*seg(t,14.6,16));
    if(t>=14.4) sceneMosquitoAndDots(t);
    vignette(lerp(0.55,0.3,seg(t,17.5,18.5)*(1-seg(t,24,25))));
  } else {
    blobs(t,eo(seg(t,32.3,33.5))*(1-seg(t,52.3,53.0)));
  }
  if(t>=30.0&&t<53.4) sceneDropToLogo(t);
  if(t>=36.2&&t<46.9) scenePhone(t);
  if(t>=46.5&&t<52.6) sceneWhyAI(t);
  if(t>=52.3) sceneClose(t);
  // fundido final
  const f=seg(t,57.7,58.4);
  if(f>0){ctx.globalAlpha=f; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;}
  // fundido de entrada
  const fi=1-seg(t,0,0.8);
  if(fi>0){ctx.globalAlpha=fi; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1;}
}
window.DURATION=DURATION;
window.setTime=t=>draw(t);
window.ready=document.fonts.load('800 80px Inter').then(()=>document.fonts.load('500 30px Inter')).then(()=>{draw(0);return true;});
</script>
